{% load tienda %}
<div class="card h-100 border-0 shadow-sm tarjeta-producto {% if producto.agotado %}producto-agotado{% endif %}">
  <a href="{{ producto.get_absolute_url }}" class="position-relative">
    {% if producto.imagen %}
      <img src="{{ producto.imagen.url }}" class="card-img-top imagen-producto" alt="{{ producto.nombre }}" loading="lazy">
    {% else %}
      <div class="card-img-top imagen-producto-vacia" aria-hidden="true"><i class="bi bi-image"></i></div>
    {% endif %}
    {% if producto.agotado %}
      <span class="badge text-bg-dark position-absolute top-0 start-0 m-2">Agotado</span>
    {% endif %}
  </a>
  <div class="card-body d-flex flex-column">
    <span class="small text-muted">{{ producto.categoria.nombre }}</span>
    <h2 class="h6 card-title mt-1">
      <a href="{{ producto.get_absolute_url }}" class="text-reset text-decoration-none">{{ producto.nombre }}</a>
    </h2>
    <div class="mt-auto d-flex justify-content-between align-items-center pt-2">
      <span class="precio fs-5">{{ producto.precio|pesos }}</span>
      {% if producto.agotado %}
        <button class="btn btn-sm btn-outline-secondary" disabled>Agotado</button>
      {% else %}
        <form method="post" action="{% url 'carrito:agregar' producto.pk %}">
          {% csrf_token %}
          <input type="hidden" name="cantidad" value="1">
          <input type="hidden" name="siguiente" value="{{ request.get_full_path }}">
          <button type="submit" class="btn btn-sm btn-marca" aria-label="Agregar {{ producto.nombre }} al carrito">
            <i class="bi bi-cart-plus"></i> Agregar
          </button>
        </form>
      {% endif %}
    </div>
  </div>
</div>
