{# Indicador de pasos del checkout: paso = 1 (envío) o 2 (confirmación) #}
<ol class="list-inline d-flex gap-3 small mb-4" aria-label="Pasos de la compra">
  <li class="list-inline-item text-success"><i class="bi bi-check-circle-fill"></i> Carrito</li>
  <li class="list-inline-item {% if paso == 1 %}fw-bold text-marca{% else %}text-success{% endif %}"
      {% if paso == 1 %}aria-current="step"{% endif %}>
    <i class="bi {% if paso == 1 %}bi-2-circle-fill{% else %}bi-check-circle-fill{% endif %}"></i> Datos de envío
  </li>
  <li class="list-inline-item {% if paso == 2 %}fw-bold text-marca{% else %}text-muted{% endif %}"
      {% if paso == 2 %}aria-current="step"{% endif %}>
    <i class="bi bi-3-circle{% if paso == 2 %}-fill{% endif %}"></i> Confirmación
  </li>
</ol>
