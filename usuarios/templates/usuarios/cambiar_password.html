{% extends 'base.html' %}

{% block titulo %}Cambiar contraseña{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">Cambiar contraseña</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'includes/_errores_form.html' %}
          {% for campo in form %}{% include 'includes/_campo.html' %}{% endfor %}
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'usuarios:perfil' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-marca">Cambiar contraseña</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
